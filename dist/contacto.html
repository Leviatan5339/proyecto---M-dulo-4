<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raíz Maya | Contacto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark fixed-top navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Raíz Maya</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="index.html"><span class="oi oi-home"></span>Inicio</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="menuCatalogo" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              <span class="oi oi-list"></span>Catálogo
            </a>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="menuCatalogo">
              <a class="dropdown-item" href="productos.html">Todos los productos</a>
              <a class="dropdown-item" href="productos.html#info">Información de compra</a>
              <a class="dropdown-item" href="productos.html#pagos">Opciones de pago</a>
            </div>
          </li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html"><span class="oi oi-envelope-closed"></span>Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
        <li class="breadcrumb-item active" aria-current="page">Contacto</li>
      </ol>
    </nav>

    <div class="row justify-content-center mb-5">
      <div class="col-12 col-lg-8">
        <h1 class="mb-2">Escríbenos</h1>
        <p class="text-muted mb-4">Haz tu pedido, resuelve una duda o déjanos un comentario.</p>

        <form class="form-panel" action="#" method="post">

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="nombre">Nombre</label>
              <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
            </div>
            <div class="form-group col-md-6">
              <label for="email">Correo electrónico</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>
          </div>

          <div class="form-group">
            <label for="motivo">Motivo del mensaje</label>
            <select class="custom-select" id="motivo" name="motivo">
              <option selected>Selecciona una opción</option>
              <option value="pedido">Hacer un pedido</option>
              <option value="duda">Resolver una duda</option>
              <option value="comentario">Dejar un comentario</option>
              <option value="suscripcion">Suscribirme a novedades</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos qué necesitas"></textarea>
          </div>

          <div class="form-group">
            <div class="custom-control custom-checkbox">
              <input type="checkbox" class="custom-control-input" id="boletin" name="boletin">
              <label class="custom-control-label" for="boletin">Quiero recibir promociones por correo</label>
            </div>
          </div>

          <div class="d-flex flex-wrap">
            <button type="submit" class="btn btn-accent mr-2 mb-2"><span class="oi oi-envelope-closed" style="color:#0f1113"></span>Enviar</button>
            <button type="reset" class="btn btn-outline-light mb-2">Limpiar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-4">
    <div class="container text-center">© 2026 Raíz Maya · Proyecto del Módulo 4</div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
